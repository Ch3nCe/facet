name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  regression:
    name: Offline regression (read-only transparency guardrail)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev + runtime pip pkg; no browser download needed for offline tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,runtime]
      - name: Byte-compile source (fail-closed on any syntax/import error)
        run: python -m compileall -q facet
      - name: Run regression suite (guardrail for transparency fix P-T + future changes)
        run: python -m pytest -q tests/
